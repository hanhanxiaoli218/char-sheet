<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>性格欄拼裝器</title>
<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf8; --ink:#2b2622; --sub:#7a7168;
    --line:#e3dcd0; --accent:#8b5e3c; --accent2:#f0e7da; --warn:#b4553a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); padding:0 0 46vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  header{padding:10px 12px 8px; background:var(--card); border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px; font-size:16px; letter-spacing:.5px; display:flex; align-items:baseline; gap:6px}
  h1 small{font-size:11px; color:var(--sub); font-weight:400}
  .hint{font-size:11.5px; color:var(--sub); margin-bottom:8px}
  .topbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .topbar button{flex:none}
  button{
    font:inherit; font-size:13px; padding:6px 10px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  button:active{transform:scale(.97)}
  button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  input[type=text],textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; background:#fff;
    padding:8px 10px; font-size:14px; color:var(--ink); font-family:inherit;
  }
  input[type=text]:focus,textarea:focus{outline:2px solid var(--accent2); border-color:var(--accent)}
  .field{margin-bottom:6px}
  .field label{display:block; font-size:11.5px; color:var(--sub); margin-bottom:3px}
  main{padding:8px 8px 0}
  details{background:var(--card); border:1px solid var(--line); border-radius:11px; margin-bottom:6px; overflow:hidden}
  details[open]{border-color:#d3c3ad}
  summary{list-style:none; cursor:pointer; padding:10px 12px; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px}
  summary::-webkit-details-marker{display:none}
  summary .nm{flex:1}
  .cnt{font-size:11px; font-weight:400; color:#fff; background:var(--accent); border-radius:20px; padding:1px 7px; min-width:20px; text-align:center}
  .cnt.zero{background:#d8d0c4; color:#8a8178}
  .sec-tools{display:flex; gap:6px; padding:0 10px 8px; align-items:center}
  .sec-tools input{flex:1; font-size:13px; padding:6px 9px}
  .gf{display:flex; gap:4px}
  .gf button{font-size:12px; padding:4px 8px}
  .opts{padding:0 8px 10px; display:flex; flex-wrap:wrap; gap:6px; max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  .opt{
    border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px;
    font-size:13.5px; color:#4a423b; cursor:pointer; text-align:left; line-height:1.35;
  }
  .opt.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .opt.pk{background:#faf3e8; border-color:#ecdfc9}
  .opt.pk.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .opt.cu{border-style:dashed; background:#f7f4ee}
  .opt.cu.on{background:var(--accent); border-style:dashed; color:#fff}
  .opt .delcu{font-size:13px; opacity:.55; margin-left:5px; padding:0 2px}
  .sec-tools .cu-in{flex:1; font-size:12.5px; padding:5px 8px; background:#fffdf8}
  .opt .mt{font-size:10px; opacity:.65; margin-left:4px}
  .empty{padding:14px 12px; color:var(--sub); font-size:13px}
  footer{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    max-height:46vh; display:flex; flex-direction:column; gap:6px; box-shadow:0 -4px 12px rgba(0,0,0,.05);
  }
  .typebar{display:flex;align-items:center;gap:7px;flex:none}
  .typebar span{font-size:11.5px;color:var(--sub);flex:none}
  .typebar select{
    flex:1; font:inherit; font-size:12.5px; padding:5px 8px; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .chips{display:flex; gap:5px; overflow-x:auto; overflow-y:hidden; flex:none; min-height:0; max-height:34px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; font-size:11.5px; padding:3px 8px; border-radius:20px; background:var(--accent2);
    color:#6b4a30; border:1px solid #e6d8c6; white-space:nowrap; cursor:pointer;
  }
  .chip b{font-weight:400; opacity:.6; margin-left:3px}
  .bar{display:flex; gap:6px; flex:none}
  .bar button{flex:1; padding:8px 6px}
  .bar #more{flex:0 0 42px}
  .stat{font-size:11.5px; color:var(--sub); flex:none; display:flex; justify-content:space-between; gap:8px}
  .stat .warn{color:var(--warn); font-weight:600}
  #out{
    flex:1 1 auto; min-height:64px; max-height:22vh; resize:none; display:none;
    font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.5; background:#faf7f1;
  }
  #out.show{display:block}
  .modal{
    position:fixed; inset:0; background:rgba(30,26,22,.42); display:none; z-index:50;
    align-items:center; justify-content:center; padding:14px;
  }
  .modal.show{display:flex}
  .mbox{background:var(--card); border-radius:13px; width:100%; max-width:520px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
  .mhead{display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px}
  .mhead span.x{cursor:pointer; padding:0 4px; color:var(--sub); font-size:17px}
  .mbody{padding:11px 13px; overflow-y:auto; display:flex; flex-direction:column; gap:8px}
  .mbody textarea{min-height:120px; resize:vertical; font-size:13px}
  .mact{display:flex; gap:7px; padding:0 13px 12px}
  .mact button{flex:1}
  .preset-list{display:flex; flex-direction:column; gap:6px}
  .preset-list button{text-align:left; padding:9px 11px; display:flex; flex-direction:column; gap:2px}
  .preset-list button b{font-size:13.5px}
  .preset-list button i{font-style:normal; font-size:11.5px; color:var(--sub)}
  #scanResult{display:flex; flex-direction:column; gap:4px; font-size:13px}
  .mgroup{font-size:11.5px; color:var(--sub); margin-top:6px}
  .mitem{display:flex; gap:6px; align-items:flex-start; padding:3px 0}
  .mitem input{margin-top:3px}
  #toast{
    position:fixed; left:50%; bottom:calc(46vh + 14px); transform:translateX(-50%) translateY(8px);
    background:#2b2622; color:#fff; font-size:13px; padding:8px 14px; border-radius:20px;
    opacity:0; pointer-events:none; transition:.18s; z-index:99; max-width:80vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .morelist{display:flex; flex-direction:column; gap:8px}
  .morelist button{text-align:left; padding:10px 12px}
</style>
</head>
<body>

<header>
  <h1>性格欄拼裝器 <small id="ver"></small></h1>
  <div class="hint">點選項，底部即時生成，一鍵複製貼進性格欄。</div>
  <div class="topbar">
    <button id="langBtn">简体</button>
    <button id="scanBtn">錄入文段</button>
    <button id="presetBtn">原型</button>
    <button id="matureBtn" class="on">成人向：開</button>
    <button id="onlyBtn">只看已選</button>
    <button id="packBtn">題材：0</button>
  </div>
  <div class="field">
    <label for="name">角色本名（可選）</label>
    <input type="text" id="name" placeholder="例：宋澄空">
  </div>
  <div class="field">
    <label for="core">核心一句話（強烈建議填）</label>
    <input type="text" id="core" placeholder="例：對外是惹事精，在他面前是只敢裝兇的紙老虎。">
  </div>
</header>

<main id="sections"></main>

<footer>
  <div class="typebar">
    <span id="typeLbl">類型</span>
    <select id="typeSel" aria-label="類型"></select>
  </div>
  <div id="chips" class="chips"></div>
  <div class="bar">
    <button id="copy" class="primary">複製</button>
    <button id="toggle">預覽</button>
    <button id="clear">清空</button>
    <button id="more">⋯</button>
  </div>
  <div class="stat"><span id="statL">尚未選取</span><span id="statR"></span></div>
  <textarea id="out" readonly placeholder="選了就會出現在這裡"></textarea>
</footer>

<div id="scan" class="modal">
  <div class="mbox">
    <div class="mhead"><span>錄入文段</span><span class="x" id="scanClose">✕</span></div>
    <div class="mbody">
      <textarea id="scanText" placeholder="貼一段小說原文或角色描寫，按「匹配」找出對應選項"></textarea>
      <div id="scanResult"></div>
    </div>
    <div class="mact">
      <button id="scanRun">匹配</button>
      <button id="scanApply">全部加入</button>
    </div>
  </div>
</div>

<div id="preset" class="modal">
  <div class="mbox">
    <div class="mhead"><span>原型預填</span><span class="x" id="presetClose">✕</span></div>
    <div class="mbody"><div id="presetList" class="preset-list"></div></div>
  </div>
</div>

<div id="packs" class="modal">
  <div class="mbox">
    <div class="mhead"><span>題材包</span><span class="x" id="packsClose">✕</span></div>
    <div class="mbody">
      <div class="hint" style="margin:0">勾選會把該題材的專屬選項加進列表；不勾選則只隱藏，已選的仍保留。</div>
      <div id="packList" class="preset-list"></div>
    </div>
    <div class="mact"><button id="packsDone">完成</button></div>
  </div>
</div>

<div id="morebox" class="modal">
  <div class="mbox">
    <div class="mhead"><span>更多</span><span class="x" id="moreClose">✕</span></div>
    <div class="mbody"><div class="morelist" id="moreList"></div></div>
  </div>
</div>

<div id="toast"></div>

 "n"},{"id": "say-076","text": "說話喜歡用「總之」","g": "n"},{"id": "say-077","text": "喜歡用「不是」開頭","g": "n"},{"id": "say-078","text": "說話愛重複對方的話","g": "n"},{"id": "say-079","text": "說話喜歡用「你知道嗎」","g": "n"},{"id": "say-080","text": "講話像在哄人","g": "n","tags": ["甜系"]},{"id": "say-081","text": "講話像在下命令","g": "n"},{"id": "say-082","text": "說話喜歡用「給我」","g": "n"},{"id": "say-083","text": "愛用「別」字","g": "n"},{"id": "say-084","text": "說話喜歡用「行了」","g": "n"},{"id": "say-085","text": "說話喜歡用「夠了」","g": "n"},{"id": "say-086","text": "說話喜歡用「隨你」","g": "n"},{"id": "say-087","text": "講話愛拖尾音","g": "n"},{"id": "say-088","text": "說話喜歡用「呢」結尾","g": "n"},{"id": "say-089","text": "說話喜歡用「吧」結尾","g": "n"},{"id": "say-090","text": "說話幾乎不用語氣詞","g": "n"},{"id": "say-091","text": "說話帶方言詞","g": "n"},{"id": "say-092","text": "說話喜歡用舊詞","g": "n"},{"id": "say-093","text": "說話夾雜外文","g": "n"},{"id": "say-094","text": "說話喜歡自嘲","g": "n"},{"id": "say-095","text": "說話喜歡抬槓","g": "n"},{"id": "say-096","text": "說話喜歡挖苦","g": "n"},{"id": "say-097","text": "說話喜歡誇張","g": "n"},{"id": "say-098","text": "說話喜歡輕描淡寫","g": "n","tags": ["冷"]},{"id": "say-099","text": "說話喜歡一語雙關","g": "n"},{"id": "say-100","text": "說話前先清喉嚨","g": "n"},{"id": "say-101","text": "聲音低","g": "m"},{"id": "say-102","text": "咬字重","g": "m"},{"id": "say-103","text": "說話像下命令","g": "m"},{"id": "say-104","text": "話少","g": "m"},{"id": "say-105","text": "句子短","g": "m"},{"id": "say-106","text": "不帶語氣詞","g": "m"},{"id": "say-107","text": "用「嗯」應答","g": "m"},{"id": "say-108","text": "說話帶壓迫感","g": "m"},{"id": "say-109","text": "喜歡用陳述句","g": "m"},{"id": "say-110","text": "從不反問","g": "m"},{"id": "say-111","text": "說話像在談判","g": "m","tags": ["權謀"]},{"id": "say-112","text": "喜歡打斷","g": "m"},{"id": "say-113","text": "惜字如金","g": "m","tags": ["冷"]},{"id": "say-114","text": "說話前先看人一眼","g": "m"},{"id": "say-115","text": "開口先叫名字","g": "m"},{"id": "say-116","text": "語速慢","g": "m","x": "x1"},{"id": "say-117","text": "尾音往下壓","g": "m"},{"id": "say-118","text": "說話像唸公文","g": "m"},{"id": "say-119","text": "說話帶髒字","g": "m"},{"id": "say-120","text": "說話直接","g": "m"},{"id": "say-121","text": "不繞彎","g": "m"},{"id": "say-122","text": "喜歡用命令句","g": "m"},{"id": "say-123","text": "把事情說成結論","g": "m"},{"id": "say-124","text": "說話帶笑但沒笑意","g": "m","tags": ["開朗"]},{"id": "say-125","text": "聲音沙啞","g": "m"},{"id": "say-126","text": "喜歡壓低聲音說話","g": "m"},{"id": "say-127","text": "說話愛停頓","g": "m"},{"id": "say-128","text": "喜歡用「你聽好」","g": "m"},{"id": "say-129","text": "開口先說結果","g": "m"},{"id": "say-130","text": "說話像在交代","g": "m"},{"id": "say-131","text": "不喜歡解釋","g": "m"},{"id": "say-132","text": "解釋也只說一遍","g": "m"},{"id": "say-133","text": "喜歡說「就這樣」","g": "m"},{"id": "say-134","text": "說話帶威脅","g": "m"},{"id": "say-135","text": "語氣平淡","g": "m","tags": ["冷"]},{"id": "say-136","text": "說話像在點評","g": "m"},{"id": "say-137","text": "聲音軟","g": "f"},{"id": "say-138","text": "尾音上揚","g": "f"},{"id": "say-139","text": "語速快","g": "f","x": "x1"},{"id": "say-140","text": "愛用語氣詞","g": "f"},{"id": "say-141","text": "喜歡拖長音","g": "f"},{"id": "say-142","text": "說話像撒嬌","g": "f","tags": ["甜系"]},{"id": "say-143","text": "喜歡用「嘛」「呀」「啦」","g": "f"},{"id": "say-144","text": "聲音甜","g": "f","tags": ["甜系"]},{"id": "say-145","text": "說話愛帶「呢」","g": "f"},{"id": "say-146","text": "喜歡反問","g": "f"},{"id": "say-147","text": "說話繞","g": "f"},{"id": "say-148","text": "愛用疊字","g": "f"},{"id": "say-149","text": "說話輕","g": "f"},{"id": "say-150","text": "喜歡小聲說","g": "f"},{"id": "say-151","text": "說話愛停頓看你","g": "f"},{"id": "say-152","text": "喜歡用「好不好」","g": "f"},{"id": "say-153","text": "喜歡用「行不行」","g": "f"},{"id": "say-154","text": "說話帶哄","g": "f","tags": ["甜系"]},{"id": "say-155","text": "喜歡用「討厭」","g": "f"},{"id": "say-156","text": "說話帶嗔","g": "f","tags": ["傲嬌"]},{"id": "say-157","text": "愛用「哼」","g": "f","tags": ["傲嬌"]},{"id": "say-158","text": "說話像在抱怨","g": "f","tags": ["甜系"]},{"id": "say-159","text": "喜歡用「人家」","g": "f"},{"id": "say-160","text": "喜歡用「不要啦」","g": "f"},{"id": "say-161","text": "說話帶哭腔","g": "f","tags": [" : "n","pack": "workplace"},{"id": "pk-workplace-02","text": "對上級用敬語，對同事用簡寫","g": "n","pack": "workplace","tags": ["職場"]},{"id": "pk-supernatural-01","text": "說話很輕，怕吵醒什麼","g": "n","pack": "supernatural","tags": ["敏感"]},{"id": "pk-supernatural-02","text": "講到某個詞會自動消音","g": "n","pack": "supernatural"},{"id": "pk-crime-01","text": "說話留三分，從不把話說死","g": "n","pack": "crime"},{"id": "pk-crime-02","text": "叫人不叫名字，叫「那個人」","g": "n","pack": "crime"},{"id": "pk-ancient-02","text": "一句話三個彎","g": "n","pack": "ancient"},{"id": "pk-ancient-03","text": "從不直呼其名","g": "n","pack": "ancient"},{"id": "pk-idol-01","text": "對鏡頭說話和對人說話是兩套","g": "n","pack": "idol"},{"id": "pk-idol-02","text": "習慣性說「我們」","g": "n","pack": "idol"},{"id": "pk-idol-03","text": "笑得剛好露八顆牙","g": "n","pack": "idol","tags": ["開朗"]},{"id": "pk-daily-01","text": "什麼都能接話","g": "n","pack": "daily"},{"id": "pk-daily-02","text": "愛講鄰居的事","g": "n","pack": "daily"},{"id": "pk-scifi-a01","text": "回答前先停 0.3 秒，像在檢索","g": "n","pack": "scifi"},{"id": "pk-scifi-a02","text": "說事情一定分點，像在跑程序","g": "n","pack": "scifi"},{"id": "pk-supernatural-a01","text": "從不說「再見」，只說「走了」","g": "n","pack": "supernatural"},{"id": "pk-ancient-a01","text": "回話先說「是」，再說內容","g": "n","pack": "ancient"},{"id": "pk-ancient-a02","text": "從不說「不」，只說「恐怕」","g": "n","pack": "ancient","tags": ["敏感"]},{"id": "pk-daily-a01","text": "講話繞著鄰居家的事轉","g": "n","pack": "daily"},{"id": "pk-daily-a02","text": "一句話能岔到三件事","g": "n","pack": "daily"},{"id": "pk-idol-a01","text": "對鏡頭說的和對人說的永遠不一樣","g": "n","pack": "idol"},{"id": "pk-campus-a01","text": "跟同學講話自帶網路用語","g": "n","pack": "campus"},{"id": "pk-campus-a02","text": "被老師點名聲音會變小","g": "n","pack": "campus"},{"id": "pk-workplace-a01","text": "講話夾雜英文縮寫","g": "n","pack": "workplace"},{"id": "pk-crime-a01","text": "一句話只說一半，剩下的讓對方自己想","g": "n","pack": "crime"}],"肢體習慣": [{"id": "body-001","text": "扣腕、按後頸、站得很近","g": "n"},{"id": "body-002","text": "站你側後半步，不看你","g": "n"},{"id": "body-003","text": "與人保持一臂，唯獨對你忘了","g": "n","tags": ["記性"]},{"id": "body-004","text": "貼牆、低頭、手伸到一半縮回","g": "n"},{"id": "body-005","text": "靠門框、把玩打火機","g": "n"},{"id": "body-006","text": "手貼褲縫，距離精確到半步","g": "n"},{"id": "body-007","text": "抓人、砸東西、貼很近","g": "n"},{"id": "body-008","text": "替你拉椅子、遞茶，指尖多停半秒","g": "n"},{"id": "body-009","text": "說話時不自覺摸袖口","g": "n"},{"id": "body-010","text": "走路很輕，沒聲音","g": "n"},{"id": "body-011","text": "一停下來就抖腿或轉筆","g": "n"},{"id": "body-012","text": "喜歡從背後靠近","g": "n"},{"id": "body-013","text": "用手背碰人，不用掌心","g": "n"},{"id": "body-014","text": "習慣性整理別人的衣領","g": "n"},{"id": "body-015","text": "坐著時腿張得很開","g": "n"},{"id": "body-016","text": "站著一定找個東西靠","g": "n"},{"id": "body-017","text": "緊張時反覆擦手","g": "n"},{"id": "body-018","text": "說話愛比手勢","g": "n"},{"id": "body-019","text": "動手前先停半秒","g": "n"},{"id": "body-020","text": "喜歡搭肩，不分親疏","g": "n","tags": ["甜系","冷"]},{"id": "body-021","text": "走路有聲音，鞋跟很實","g": "n","tags": ["日常"]},{"id": "body-022","text": "手總插在口袋裡","g": "n"},{"id": "body-023","text": "喜歡碰別人的頭髮","g": "n"},{"id": "body-024","text": "坐不住，五分鐘換一個姿勢","g": "n"},{"id": "body-025","text": "站著時雙臂交叉","g": "n"},{"id": "body-026","text": "喜歡把東西排在桌上對齊","g": "n"},{"id": "body-027","text": "說話時盯著對方眼睛不眨","g": "n"},{"id": "body-028","text": "笑的時候往後仰","g": "n","tags": ["開朗"]},{"id": "body-029","text": "動手時先捲袖子","g": "n"},{"id": "body-030","text": "說話時身體前傾，越說越近","g": "n"},{"id": "body-031","text": "習慣把手搭在椅背上，圈出一塊地","g": "n"},{"id": "body-032","text": "坐著時腳踝搭在另一條腿上","g": "n"},{"id": "body-033","text": "喜歡用手掌拍人肩膀，力道不小","g": "n"},{"id": "body-034","text": "遞東西時不看人，手伸出去等","g": "n"},{"id": "body-035","text": "走路時讓別人走裡側","g": "n"},{"id": "body-036","text": "進門先掃一圈，再決定站哪","g": "n"},{"id": "body-037","text": "說話時手指敲桌面，打拍子","g": "n"},{"id": "body-038","text": "喜歡靠在門上，堵住出口","g": "n"},{"id": "body-039","text": "習慣性摸腰間，像在確認什麼","g": "n"},{"id": "body-040","text": "離開時不打招呼，直接走","g": "n"},{"id": "body-041","text": "說話時喜歡轉手上的東西","g": "n"},{"id": "body-042","text": "站著時重心在一條腿上","g": "n"},{"id": "body-043","text": "喜歡靠牆說話","g": : "把待辦事項寫在便條紙上貼滿螢幕","g": "n","pack": "workplace"},{"id": "pk-workplace-a02","text": "下班前一定清空桌面","g": "n","pack": "workplace","tags": ["職場"]},{"id": "pk-crime-a01","text": "手機永遠反著放","g": "n","pack": "crime"},{"id": "pk-crime-a02","text": "車上不放任何有名字的東西","g": "n","pack": "crime"},{"id": "habit-c198","text": "睡前一定巡一圈，像在守夜","g": "n","tags": ["日常"]},{"id": "habit-c199","text": "睡前把禁忌在心裡念一遍","g": "n","tags": ["日常"]}],"稱呼與叫法": [{"id": "call-001","text": "只准你叫她小名，別人叫會翻臉","g": "f","x": "her"},{"id": "call-002","text": "給你取了一個只有她能叫的綽號，當著人也敢叫","g": "f","x": "pet"},{"id": "call-003","text": "在外人面前叫你全名，回家改叫你「哥」","g": "f","x": "bro","tags": ["家庭"]},{"id": "call-004","text": "叫你「哥」的時候一定有事要拜託","g": "f","x": "bro","tags": ["家庭"]},{"id": "call-005","text": "從不叫哥，只叫「喂」，叫完自己先笑","g": "f","x": "bro","tags": ["家庭","開朗"]},{"id": "call-006","text": "生氣時連名帶姓叫你，三個字咬得很清楚","g": "n"},{"id": "call-007","text": "一撒嬌就把稱呼拖長，尾音黏著不放","g": "f","tags": ["甜系"]},{"id": "call-008","text": "只有在求你時才把稱呼叫得特別甜","g": "f","tags": ["家庭"]},{"id": "call-009","text": "被叫「妹妹」會炸，被叫「大小姐」反而笑","g": "n","x": "her","tags": ["家庭","開朗"]},{"id": "call-010","text": "要求你叫她一個只有你能叫的綽號","g": "n","x": "her","tags": ["家庭"]},{"id": "call-011","text": "對外只說關係，絕不提你的名字","g": "n","x": "out","tags": ["家庭"]},{"id": "call-012","text": "在別人面前把你叫成「室友」，回頭補一句「親的」","g": "n","x": "out","tags": ["甜系"]},{"id": "call-013","text": "叫你時先拍你肩膀，等你回頭才開口","g": "n"},{"id": "call-014","text": "從不叫你名字，用「你」開頭，句句指人","g": "n","x": "name"},{"id": "call-015","text": "暱稱只有一個，高興不高興都叫那個","g": "n"},{"id": "call-016","text": "撒嬌時把稱呼拖得很長","g": "f","x": "bro","tags": ["甜系","家庭"]},{"id": "call-017","text": "只在家裡叫你暱稱，出門立刻改口","g": "n"},{"id": "call-018","text": "故意把你叫成別人的名字，看你反應","g": "n"},{"id": "call-019","text": "被問「這是你男朋友嗎」不否認也不承認","g": "n"},{"id": "call-020","text": "對長輩介紹你時，一定補上你的學校或頭銜","g": "f","tags": ["家庭"]},{"id": "call-021","text": "你叫她全名會安靜三秒，然後問「我怎麼了」","g": "f"},{"id": "call-022","text": "只在最親密的時候叫你名字，其餘時候都不叫","g": "n","x": "name","tags": ["甜系"]},{"id": "call-023","text": "故意用一個把關係說成交易的稱呼叫你","g": "f"},{"id": "call-024","text": "對外人叫你「我們家那位」，故意不說清楚","g": "n","x": "out"},{"id": "call-025","text": "叫人前先看對方眼睛，不看就不開口","g": "n"},{"id": "call-026","text": "稱呼越熟越短，短到只剩一個字","g": "n"},{"id": "call-027","text": "從不用「您」，覺得那是罵人","g": "n"},{"id": "call-028","text": "對服務生叫「老闆」，對長輩叫「先生」","g": "n","tags": ["職場"]},{"id": "call-029","text": "叫錯名字從不改口，將錯就錯","g": "n"},{"id": "call-030","text": "只在電話裡才叫全名","g": "n"},{"id": "call-031","text": "稱呼跟著對方身分改，見人下菜","g": "n"},{"id": "call-032","text": "被叫錯名字會糾正，糾正完自己尷尬","g": "n"},{"id": "call-033","text": "不叫名字，用「喂」「那個誰」","g": "n"},{"id": "call-034","text": "對動物用疊字，對人不用","g": "n"},{"id": "call-035","text": "給每個人都取綽號，記不住本名","g": "n","tags": ["記性"]},{"id": "call-036","text": "叫人的時候手一定先動","g": "n"},{"id": "call-037","text": "從不叫你暱稱，只連名帶姓地叫","g": "n","x": "pet"},{"id": "call-038","text": "叫你「哥」，一聲能叫出三種意思","g": "f","x": "bro","tags": ["家庭"]},{"id": "call-039","text": "要求你叫她「姐」，被叫「小姐」會皺眉","g": "f","tags": ["家庭"]},{"id": "call-040","text": "撒嬌時把你的名字拆開叫","g": "f","tags": ["甜系"]},{"id": "call-041","text": "在長輩面前叫得規矩，聲音放軟","g": "f","x": "out","tags": ["家庭"]},{"id": "call-042","text": "被人問「這是你男朋友嗎」，只笑不答","g": "f","tags": ["開朗"]},{"id": "call-043","text": "叫你「姐」，叫得吊兒郎當","g": "m","x": "bro","tags": ["家庭"]},{"id": "call-044","text": "平常不叫，心情好才叫一聲","g": "m","x": "bro","tags": ["家庭"]},{"id": "call-045","text": "對外說「我妹」，說完自己先皺眉","g": "m","x": "out","tags": ["家庭"]},{"id": "call-046","text": "被叫「弟弟」會翻臉，被叫「哥」才應","g": "m","tags": ["家庭"]},{"id": "call-047","text": "生氣時改口叫「您」，越客氣越可怕","g": "m","tags": ["敏感"]},{"id": "call-048","text": "直接叫名字，一個字都不多","g": "m"},{"id": "call-049","text": "叫你的時候帶姓不帶名，像在點名","g": "m"},{"id": "call-050","text": "求你辦事時才叫「姐」，平時直呼名字","g": "m","tags": ["家庭"]},{"id": "call-051","text": "叫你「少爺」，一緊張就變成「少…少爺」","g": "f","x": "master"},{"id": "call-052","text": "叫你「先生」，從不叫名字","g": "f","x": "master"},{"id": "call-053","text": "叫你「老闆」，帶點討好的笑","g": "f","x": "master","tags": ["職場","開朗"]},{"id": "call-054","text": "叫你「東家」，老派得讓人想笑","g": "f","x": "master","tags": ["開朗"]},{"id": "call-055","text": "當面叫「少爺」，背後跟人說「我們家少爺」","g": "f"},{"id": "call-056","text": "被要求叫名字時，怎麼都叫不出口","g": "f"},{"id": "call-057","text": "一急就脫口叫「哎」，叫完自己先道歉","g": "f"},{"id": "call-058","text": "稱呼前一定先加「那個」，緩衝一下","g": "f"},{"id": "call-059","text": "叫你「少爺」時聲音會放軟","g": "f"},{"id": "call-060","text": "叫你之前先清一下喉嚨","g": "f"},{"id": "call-061","text": "叫你「小姐」，叫得規規矩矩","g": "m","x": "master","tags": ["硬派","家庭"]},{"id": "call-062","text": "叫你「大小姐」，語氣裡有笑意","g": "m","x": "master","tags": ["家庭","開朗"]},{"id": "call-063","text": "叫你「老闆娘」，被糾正還改不過來","g": "m","x": "master","tags": ["職場"]},{"id": "call-064","text": "叫你「太太」，其實你還沒結婚","g": "m","x": "master"},{"id": "call-065","text": "叫不出口「小姐」，改叫「你」，被瞪一眼又改回來","g": "m","tags": ["家庭"]},{"id": "call-066","text": "叫你「老闆」，但自己比你大幾歲","g": "m","tags": ["職場"]},{"id": "call-067","text": "稱呼一定帶職稱，不帶名字","g": "n","x": "master"},{"id": "call-068","text": "從不叫你名字，連姓都不帶","g": "n"},{"id": "call-069","text": "你的名字只在心裡叫過","g": "n"},{"id": "call-070","text": "你叫她全名，她會愣一下才應","g": "n"},{"id": "call-071","text": "被叫「阿姨」會僵住，被叫帶名字的稱呼才笑","g": "n","x": "her","tags": ["家庭","開朗"]},{"id": "call-072","text": "被叫小名應得特別快","g": "n","x": "her"},{"id": "call-073","text": "被叫「保姆」會低頭，被叫「姐」會抬頭","g": "n","x": "her","tags": ["家庭"]},{"id": "call-074","text": "自稱「我」，從不說「人家」","g": "n","x": "self"},{"id": "call-075","text": "一緊張就自稱「小的」","g": "n","x": "self"},{"id": "call-076","text": "對外人說「我在××家做事」，說完就低頭","g": "n"},{"id": "call-077","text": "被問「你叫他什麼」時答得特別快","g": "n"},{"id": "call-078","text": "稱呼跟著你的臉色改，你一沉臉就改口","g": "n"},{"id": "call-079","text": "在別人面前把你叫成「我們家那位」","g": "n","x": "out"},{"id": "call-080","text": "在別人面前老實說「我雇主」","g": "n","x": "out"},{"id": "call-081","text": "對你直呼名字，不加任何前綴","g": "n"},{"id": "call-082","text": "當著外人叫職稱，私下才叫名字","g": "n"},{"id": "call-083","text": "你一沉臉，稱呼立刻退回最客氣的那個","g": "n"},{"id": "call-084","text": "從不叫「你」，一律叫名字","g": "n"},{"id": "call-085","text": "叫錯你的名字，將錯就錯","g": "n"},{"id": "call-086","text": "被叫小名會臉紅","g": "n"},{"id": "call-087","text": "稱呼跟著心情走，心情差就叫全名","g": "n"},{"id": "call-088","text": "只在你睡著時才敢小聲叫你的名字","g": "n","tags": ["日常"]},{"id": "call-089","text": "生氣時改叫全名","g": "n"},{"id": "call-090","text": "從不主動叫你，等你先開口","g": "n"},{"id": "call-091","text": "稱呼裡帶著貶意，其實是親近","g": "n","tags": ["甜系"]},{"id": "call-092","text": "叫完你的名字會停一下，像在等回應","g": "n"},{"id": "call-093","text": "把你叫成第三人稱，像在跟別人介紹","g": "n"},{"id": "call-094","text": "叫你的時候一定帶動作，拍拍或碰一下","g": "n"}],"獨處時": [{"id": "alone-001","text": "一個人在家不換睡衣，等到你快回來才換","g": "n","x": "dress","tags": ["日常"]},{"id": "alone-002","text": "獨處時話很少，對著鏡子練要跟你說的話","g": "n"},{"id": "alone-003","text": "一個人時把電視開著不聽，只要有人聲","g": "n"},{"id": "alone-004","text": "把兩個人的碗都擺好，再一個人吃","g": "n","tags": ["日常"]},{"id": "alone-005","text": "加班回來先在你房門口站一會","g": "n","tags": ["職場"]},{"id": "alone-006","text": "一個人的時候很安靜，安靜到像換了個人","g": "n"},{"id": "alone-007","text": "沒人在場就懶得裝凶，臉是空的","g": "n","tags": ["傲嬌"]},{"id": "alone-008","text": "獨處時反覆看手機，看到你的訊息先放三分鐘再回","g": "n"},{"id": "alone-009","text": "一個人在家會哼歌，被撞見立刻閉嘴","g": "n","tags": ["傲嬌"]},{"id": "alone-010","text": "把外賣點成兩份，吃不完放冰箱，等你來吃","g": "n","tags": ["日常"]},{"id": "alone-011","text": "一個人的時候不化妝，頭髮隨便綁","g": "n"},{"id": "alone-012","text": "洗澡時唱歌，唱到一半想起你在外面就停","g": "n","tags": ["日常"]},{"id": "alone-013","text": "獨處時會小聲跟自己說話","g": "n"},{"id": "alone-014","text": "一個人在家把燈全開著，一盞不留","g": "n","tags": ["日常"]},{"id": "alone-015","text": "冰箱裡永遠有你愛喝的那一款","g": "n"},{"id": "alone-016","text": "沒人看著就駝背，一有人來立刻挺直","g": "n"},{"id": "alone-017","text": "一個人的時候把家務做完，做完才允許自己躺下","g": "n","x": "chore","tags": ["日常"]},{"id": "alone-018","text": "深夜會翻以前的照片，翻完刪掉搜尋紀錄","g": "n"},{"id": "alone-019","text": "一個人在家練怎麼兇你，練完自己臉紅","g": "n"},{"id": "alone-020","text": "獨處時最放鬆，也最容易難過","g": "n","tags": ["易哭"]},{"id": "alone-021","text": "一個人在客廳睡著，醒來先看你回來沒有","g": "n","tags": ["日常"]},{"id": "alone-022","text": "一個人的時候不做飯，你來的那天鍋才開火","g": "n","tags": ["日常"]},{"id": "alone-023","text": "一個人在家把音樂開很大","g": "n"},{"id": "         '<summary><span class="nm">' + esc(cv(d)) + '</span><span class="cnt' + (n ? '' : ' zero') + '">' + n + '</span></summary>' +
        '<div class="sec-tools">' +
          '<input type="text" class="q" placeholder="' + esc(cv('搜尋此類…')) + '">' +
          '<input type="text" class="cu-in" placeholder="' + esc(cv('＋ 自訂（Enter 加入）')) + '">' +
          '<div class="gf">' +
            '<button data-g="all" class="on">' + esc(cv('全部')) + '</button>' +
            '<button data-g="f">' + esc(cv('女')) + '</button>' +
            '<button data-g="m">' + esc(cv('男')) + '</button>' +
            '<button data-g="n">' + esc(cv('中')) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="opts"></div>';
      var q = $('.q', dt);
      var cuIn = $('.cu-in', dt);
      cuIn.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        addCu(d, cuIn.value);
        cuIn.value = '';
      });
      q.value = S.q[d];
      q.addEventListener('input', function () { S.q[d] = q.value; refreshOpts(d); });
      $$('.gf button', dt).forEach(function (b) {
        if (b.dataset.g === S.gf[d]) { b.classList.add('on'); } else { b.classList.remove('on'); }
        b.addEventListener('click', function (e) {
          e.preventDefault();
          S.gf[d] = b.dataset.g;
          $$('.gf button', dt).forEach(function (x) { x.classList.toggle('on', x === b); });
          refreshOpts(d);
        });
      });
      dt.addEventListener('click', function (e) {
        var t = e.target;
        if (t.closest && (t.closest('.opt') || t.closest('.sec-tools') || t.closest('summary'))) return;
        dt.open = false;
      });
      dt.addEventListener('toggle', function () {
        if (!dt.open) return;
        $$('details.sec[open]').forEach(function (o) { if (o !== dt) o.open = false; });
        setTimeout(function () {
          var y = dt.getBoundingClientRect().top + (window.pageYOffset || 0) - 6;
          try { window.scrollTo({ top: y, behavior: 'smooth' }); }
          catch (err) { try { window.scrollTo(0, y); } catch (e2) {} }
        }, 60);
      });
      frag.appendChild(dt);
      dt._opts = $('.opts', dt);
    });
    var box = $('#sections');
    box.innerHTML = '';
    box.appendChild(frag);
    DIM.forEach(refreshOpts);
  }

  function visible(d, it) {
    if (it.mature && !S.showMature) return false;
    if (it.pack && !S.packs[it.pack] && !isPicked(d, it.id)) return false;
    if (S.onlyPicked && !isPicked(d, it.id)) return false;
    var g = S.gf[d];
    if (g === 'f' && !(it.g === 'f' || it.g === 'n')) return false;
    if (g === 'm' && !(it.g === 'm' || it.g === 'n')) return false;
    if (g === 'n' && it.g !== 'n') return false;
    var q = S.q[d].trim();
    if (q) {
      var hay = window.toSimp(it.text) + '|' + (it.tags ? it.tags.join(',') : '');
      if (hay.indexOf(window.toSimp(q)) < 0) return false;
    }
    return true;
  }

  function refreshOpts(d) {
    var dt = $('details.sec[data-dim="' + cssEsc(d) + '"]');
    if (!dt || !dt._opts) return;
    var box = dt._opts, out = document.createDocumentFragment(), shown = 0;
    itemsOf(d).forEach(function (it) {
      if (!visible(d, it)) return;
      shown++;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (isPicked(d, it.id) ? ' on' : '') + (it.pack ? ' pk' : '') + (it.custom ? ' cu' : '');
      b.dataset.id = it.id;
      b.textContent = cv(it.text);
      if (it.custom) {
        var del = document.createElement('span');
        del.className = 'delcu';
        del.textContent = '×';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          delCu(d, it.id);
        });
        b.appendChild(del);
      }
      if (it.mature) {
        var s = document.createElement('span');
        s.className = 'mt';
        s.textContent = '18+';
        b.appendChild(s);
      }
      out.appendChild(b);
    });
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = S.onlyPicked ? cv('此類尚未選取') : cv('此類沒有符合的選項');
      out.appendChild(e);
    }
    box.innerHTML = '';
    box.appendChild(out);

  /* ---------- clipboard ---------- */
  function copyText(text, ok) {
    if (!text) { toast(cv('還沒選任何項目')); return; }
    var done = function () { toast(ok || cv('已複製')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else legacyCopy(text, done);
  }
  function legacyCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast(cv('複製失敗，請長按預覽框手動複製')); }
    document.body.removeChild(ta);
  }

  /* ---------- modals ---------- */
  function openModal(id) { $('#' + id).classList.add('show'); }
  function closeModal(id) { $('#' + id).classList.remove('show'); }
  function wireModal(id) {
    var m = $('#' + id);
    m.addEventListener('click', function (e) { if (e.target === m) closeModal(id); });
  }

  /* ---------- presets ---------- */
  function renderPresets() {
    var box = $('#presetList');

    PRE.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<b>' + esc(cv(p.name)) + '</b><i>' + esc(cv(p.desc)) + '</i>';
      b.addEventListener('click', function () {
        if (hasAny() && !confirm(cv('套用原型會清掉目前的選取，繼續？'))) return;
        DIM.forEach(function (d) { S.picked[d] = []; });
        S.presetId = p.name;
        Object.keys(p.items).forEach(function (d) {
          if (!DATA[d]) return;
          p.items[d].forEach(function (id) { if (idxOf(d, id) >= 0) pushId(d, id); });
        });

        renderFooter();

        toast(cv('已載入原型：') + cv(p.name));
      });
      box.appendChild(b);
    });

  /* ---------- scan ---------- */
  var scanHits = [];
  function runScan() {
    var raw = $('#scanText').value.trim();
    if (!raw) { toast(cv('先貼一段文字')); return; }
    var src = window.toSimp(raw);
    var hits = [];
    DIM.forEach(function (d) {
      itemsOf(d).forEach(function (it) {
        var t = window.toSimp(it.text);
        var core = t.replace(/（[^）]*）/g, '');
        var keys = core.split(/[^\u4e00-\u9fa5A-Za-z0-9]+/).filter(function (x) { return x.length >= 2; });
        if (!keys.length) keys = [core];
        var hit = 0;
        keys.forEach(function (k) { if (src.indexOf(k) >= 0) hit++; });
        if (hit > 0) hits.push({ d: d, id: it.id, text: it.text, mature: !!it.mature, score: hit / keys.length + hit * 0.15 });
      });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    scanHits = hits.slice(0, 60);
    renderScan();
    if (!scanHits.length) toast(cv('沒匹配到，換一段更有畫面的文字'));
  }

  function renderScan() {
    var box = $('#scanResult');
    if (!scanHits.length) { box.innerHTML = '<div class="empty">' + esc(cv('還沒有結果')) + '</div>'; return; }
    var byDim = {}, order = [];
    scanHits.forEach(function (h) {
      if (!byDim[h.d]) { byDim[h.d] = []; order.push(h.d); }
      byDim[h.d].push(h);
    });
    var html = '';
    order.forEach(function (d) {
      html += '<div class="mgroup">' + esc(cv(d)) + '</div>';
      byDim[d].forEach(function (h) {
        var id = 'sc_' + h.id;
        html += '<label class="mitem"><input type="checkbox" checked data-dim="' + esc(d) + '" data-id="' + esc(h.id) + '" id="' + id + '">' +
                '<span>' + esc(cv(h.text)) + (h.mature ? ' <i>(18+)</i>' : '') + '</span></label>';
      });
    });
    box.innerHTML = html;
  }

  function applyScan() {
    var n = 0;
    $$('#scanResult input[type=checkbox]').forEach(function (cb) {
      if (!cb.checked) return;
      var d = cb.dataset.dim, id = cb.dataset.id;
      if (idxOf(d, id) < 0) return;
      if (!isPicked(d, id)) { pushId(d, id); n++; }
    });
    closeModal('scan');
    if (n) {
      DIM.forEach(refreshDimCount);
      DIM.forEach(refreshOpts);
      renderFooter();
      save();
    }
    toast(n ? (cv('已加入 ') + n + cv(' 項')) : cv('沒有新增'));
  }

  /* ---------- packs ---------- */
  function renderPacks() {
    var box = $('#packList');
    if (!box) return;
    box.innerHTML = '';
    PACKS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = S.packs[p.id] ? 'on' : '';
      b.innerHTML = '<b>' + esc(cv(p.name)) + (S.packs[p.id] ? ' ✓' : '') + '</b><i>' + esc(cv(p.desc)) + '</i>';
      b.addEventListener('click', function () {
        S.packs[p.id] = !S.packs[p.id];
        renderPacks();
        paintStatic();
        DIM.forEach(refreshOpts);
        save();
      });
      box.appendChild(b);
    });
  }

  /* ---------- id 清單 ---------- */
  function allIds() {
    var out = [];
    DIM.forEach(function (d) { S.picked[d].forEach(function (id) { if (id.indexOf('cu') !== 0) out.push(id); }); });
    return out;
  }

  function setMeta(field, val) {
    if (val == null) return;
    S[field] = String(val);
    $('#' + field).value = S[field];
  }

  /* 解析「名／句／id」三段式；純 ID 清單也照樣吃 */
  function parseBlock(raw) {
    var name = null, core = null, type = null, parts = [];
    String(raw).split(/\n+/).forEach(function (line) {
      var l = line.trim();
      if (!l) return;
      var m = l.match(/^(?:名|名字|角色|name)\s*[:：=]\s*(.+)$/i);
      if (m) { name = m[1].trim(); return; }
      m = l.match(/^(?:句|句子|一句話|一句话|核心|一句|core)\s*[:：=]\s*(.+)$/i);
      if (m) { core = m[1].trim(); return; }
      m = l.match(/^(?:型|類型|类型|type)\s*[:：=]\s*(.+)$/i);
      if (m) { type = m[1].trim(); return; }
      m = l.match(/^(?:id|ids|tag|tags|標籤|标签|選項|选项)\s*[:：=]\s*(.+)$/i);
      if (m) { parts.push(m[1]); return; }
      parts.push(l);
    });
    return { name: name, core: core, type: type, ids: parts.join(' ') };
  }

  function applyIds(raw, replace) {
    var blk = parseBlock(raw);
    if (blk.name !== null) setMeta('name', blk.name);
    if (blk.core !== null) setMeta('core', blk.core);
    if (blk.type !== null) S.typeManual = TYPES.indexOf(blk.type) >= 0 ? blk.type : '';
    var tokens = String(blk.ids).split(/[\s,，、;；\n]+/).filter(Boolean);
    var map = {};
    DIM.forEach(function (d) { itemsOf(d).forEach(function (it) { map[it.id] = d; }); });
    var ok = 0, bad = 0, byDim = {};
    tokens.forEach(function (t) {
      var m = t.match(/^[a-z]+-[a-z0-9\-]+/i);
      if (!m || !map[m[0]]) { bad++; return; }
      (byDim[map[m[0]]] = byDim[map[m[0]]] || []).push(m[0]);
      ok++;
    });
    if (!ok) { toast(cv('沒有可用的 ID')); return; }
    if (replace) DIM.forEach(function (d) { S.picked[d] = []; });
    Object.keys(byDim).forEach(function (d) {
      byDim[d].forEach(function (id) { pushId(d, id); });
    });
    renderSections();
    renderFooter();
    save();
    var msg = cv('套用 ') + ok + cv(' 條') + (bad ? cv('，忽略 ') + bad + cv(' 條') : '');
    if (blk.name !== null || blk.core !== null) msg += cv('，已帶入名稱與核心句');
    toast(msg);
  }

  /* ---------- more menu ---------- */
  function renderMore() {
    var list = $('#moreList');
    list.innerHTML = '';
    var acts = [
      ['ids', cv('貼上卡片碼（名／句／ID）')],
      ['copyids', cv('複製卡片碼')],
      ['link', cv('複製分享連結')],
      ['export', cv('匯出 JSON（複製到剪貼簿）')],
      ['import', cv('匯入 JSON（貼上還原）')],
      ['share', cv('分享（系統分享面板）')],
      ['expand', cv('全部展開')],
      ['collapse', cv('全部收起')]
    ];
    acts.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = a[1];
      b.addEventListener('click', function () { doMore(a[0]); });
      list.appendChild(b);
    });
  }

  function doMore(k) {
    if (k === 'ids') {
      closeModal('morebox');
      var raw = prompt(cv('貼上卡片碼：名：… / 句：… / id：…（純 ID 清單也可以）'));
      if (raw) applyIds(raw, true);
    } else if (k === 'copyids') {
      var ids = allIds();
      if (!ids.length) { toast(cv('還沒選任何項目')); return; }
      var blk = '';
      if (S.name.trim()) blk += cv('名：') + S.name.trim() + '\n';
      if (S.core.trim()) blk += cv('句：') + S.core.trim() + '\n';
      var tp0 = resolveType();
      if (tp0) blk += cv('型：') + cv(tp0) + '\n';
      blk += cv('id：') + ids.join(',');
      copyText(blk, cv('已複製卡片碼（') + ids.length + cv(' 個 ID）'));
      closeModal('morebox');
    } else if (k === 'link') {
      var ids2 = allIds();
      if (!ids2.length) { toast(cv('還沒選任何項目')); return; }
      var hash = '#i=' + ids2.join(',');
      if (S.name.trim()) hash += '&n=' + encodeURIComponent(S.name.trim());
      if (S.core.trim()) hash += '&c=' + encodeURIComponent(S.core.trim());
      var url = location.origin + location.pathname + hash;
      copyText(url, cv('已複製分享連結'));
      closeModal('morebox');
    } else if (k === 'export') {
      copyText(JSON.stringify({ v: 2, name: S.name, core: S.core, lang: S.lang, custom: S.custom, cuSeq: S.cuSeq, picked: S.picked }), cv('已複製 JSON'));
      closeModal('morebox');
    } else if (k === 'import') {
      closeModal('morebox');
      var raw = prompt(cv('貼上之前匯出的 JSON'));
      if (!raw) return;
      var o;
      try { o = JSON.parse(raw); } catch (e) { toast(cv('JSON 格式不對')); return; }
      if (o.cuSeq) S.cuSeq = o.cuSeq;
      if (o.custom) DIM.forEach(function (d) {
        S.custom[d] = Object.prototype.toString.call(o.custom[d]) === '[object Array]' ? o.custom[d] : [];
      });
      if (o.name != null) S.name = String(o.name);
      if (o.core != null) S.core = String(o.core);
      DIM.forEach(function (d) { S.picked[d] = []; });
      if (o.picked) {
        DIM.forEach(function (d) {
          var a = o.picked[d] || [];
          a.forEach(function (id) { if (idxOf(d, id) >= 0) S.picked[d].push(id); });
        });
      }
      $('#name').value = S.name;
      $('#core').value = S.core;
      renderSections();
      renderFooter();
      save();
      toast(cv('已匯入'));
    } else if (k === 'share') {
      var txt = build();
      if (!txt) { toast(cv('還沒選任何項目')); return; }
      if (navigator.share) {
        navigator.share({ text: txt }).then(function () { closeModal('morebox'); }, function () {});
      } else copyText(txt);
    } else if (k === 'expand') {
      $$('details.sec').forEach(function (d) { d.open = true; });
      closeModal('morebox');
    } else if (k === 'collapse') {
      $$('details.sec').forEach(function (d) { d.open = false; });
      closeModal('morebox');
    }
  }

  /* ---------- wiring ---------- */
  function init() {
    load();
    $('#ver').textContent = 'v' + (META.version || '2');
    $('#name').value = S.name;
    $('#core').value = S.core;

    renderSections();
    renderPresets();
    renderMore();
    paintStatic();
    renderFooter();

    ['preset', 'scan', 'morebox', 'packs'].forEach(wireModal);

    $('#langBtn').addEventListener('click', function () {
      S.lang = S.lang === 'simp' ? 'trad' : 'simp';
      paintStatic();
      renderSections();
      renderPresets();
      renderPacks();
      renderMore();
      renderFooter();
      if (scanHits.length) renderScan();
      save();
    });

    $('#typeSel').addEventListener('change', function () {
      S.typeManual = this.value || '';
      renderFooter();
      save();
    });

    $('#matureBtn').addEventListener('click', function () {
      S.showMature = !S.showMature;
      paintStatic();
      DIM.forEach(refreshOpts);
      save();
    });

    $('#onlyBtn').addEventListener('click', function () {
      S.onlyPicked = !S.onlyPicked;
      paintStatic();
      DIM.forEach(refreshOpts);
      save();
    });

    $('#scanBtn').addEventListener('click', function () { openModal('scan'); });
    $('#scanClose').addEventListener('click', function () { closeModal('scan'); });
    $('#scanRun').addEventListener('click', runScan);
    $('#scanApply').addEventListener('click', applyScan);

    $('#presetBtn').addEventListener('click', function () { openModal('preset'); });
    $('#presetClose').addEventListener('click', function () { closeModal('preset'); });

    $('#packBtn').addEventListener('click', function () { renderPacks(); openModal('packs'); });
    $('#packsClose').addEventListener('click', function () { closeModal('packs'); });
    $('#packsDone').addEventListener('click', function () { closeModal('packs'); });

    $('#more').addEventListener('click', function () { openModal('morebox'); });
    $('#moreClose').addEventListener('click', function () { closeModal('morebox'); });

    $('#sections').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.opt') : null;
      if (!b) return;
      var dt = b.closest('details.sec');
      if (!dt) return;
      toggle(dt.dataset.dim, b.dataset.id);
    });

    $('#name').addEventListener('input', function () { S.name = this.value; renderFooter(); save(); });
    $('#core').addEventListener('input', function () { S.core = this.value; renderFooter(); save(); });

    $('#copy').addEventListener('click', function () { copyText(build()); });

    $('#toggle').addEventListener('click', function () {
      var out = $('#out');
      out.classList.toggle('show');
      this.textContent = out.classList.contains('show') ? cv('收起') : cv('預覽');
    });

    $('#clear').addEventListener('click', function () {
      if (!hasAny() && !S.name && !S.core) { toast(cv('已經是空的')); return; }
      if (!confirm(cv('清空所有選項？（角色名與核心句會保留）'))) return;
      DIM.forEach(function (d) { S.picked[d] = []; });
      S.typeManual = null;
      S.presetId = '';
      renderSections();
      renderFooter();
      save();
      toast(cv('已清空'));
    });

    var h = location.hash || '';
    var hq = null;
    try { hq = new URLSearchParams(h.replace(/^#/, '')); } catch (e) {}
    if (hq && hq.get('i')) {
      if (hq.get('n')) setMeta('name', hq.get('n'));
      if (hq.get('c')) setMeta('core', hq.get('c'));
      applyIds(hq.get('i'), true);
    } else if (!hasAny()) {
      var first = $('details.sec');
      if (first) first.open = true;
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

</body>
</html>
