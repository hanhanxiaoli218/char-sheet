<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>性格欄拼裝器</title>
<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf8; --ink:#2b2622; --sub:#7a7168;
    --line:#e3dcd0; --accent:#8b5e3c; --accent2:#f0e7da;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:0 0 92px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.5;
  }
  header{padding:12px 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0 0 3px;font-size:16.5px;letter-spacing:.5px}
  .hint{font-size:12px;color:var(--sub);margin-bottom:9px}
  input[type=text],textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;
    padding:9px 10px;font-size:14px;color:var(--ink);font-family:inherit;
  }
  input[type=text]:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
  .field{margin-bottom:7px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  main{padding:9px 10px 0}
  details{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;overflow:hidden;scroll-margin-top:8px}
  details[open]{border-color:#d3c3ad}
  summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary .cnt{font-size:11.5px;font-weight:400;color:#fff;background:var(--accent);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
  summary .cnt.zero{background:#d8d0c4;color:#8a8178}
  .gfilter{display:flex;gap:6px;padding:0 8px 8px}
  .gfilter button{flex:0 0 auto;background:#f3ece1;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:400}
  .gfilter button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opts{padding:0 8px 10px;display:flex;flex-wrap:wrap;gap:7px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px;color:#4a423b;cursor:pointer;transition:.12s;user-select:none}
  .opt:active{transform:scale(.97)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .topbar{display:flex;gap:8px;margin-top:8px}
  .topbar button{flex:1;background:var(--accent2);color:var(--accent);padding:9px;font-size:13.5px}
  #langBtn{flex:0 0 76px}
  .modal{position:fixed;inset:0;background:rgba(30,25,20,.55);display:none;z-index:100;padding:14px;overflow-y:auto}
  .modal.show{display:block}
  .mbox{background:var(--card);border-radius:14px;padding:12px;max-width:560px;margin:30px auto;display:flex;flex-direction:column}
  .mhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:8px}
  #scanClose{color:var(--sub);cursor:pointer;padding:0 6px;font-size:17px}
  #scanText{height:110px;margin-bottom:8px}
  .mact{display:flex;gap:8px;margin-bottom:8px}
  .mact button{flex:1;background:var(--accent);color:#fff;padding:10px}
  #scanApply{background:var(--accent2);color:var(--accent);flex:0 0 90px}
  #scanResult{overflow-y:auto;font-size:13.5px;line-height:1.6;max-height:52vh}
  .mh{background:#fff3c9;color:#5a4a00;border-radius:3px;padding:0 2px}
  .mgroup{margin-top:8px;font-weight:600;color:var(--accent);font-size:13px}
  .mitem{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line)}
  .mitem input{margin-top:3px}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px 10px;z-index:20;box-shadow:0 -6px 18px rgba(80,60,40,.07)}
  .bar{display:flex;gap:8px;margin-bottom:7px}
  button{flex:1;border:0;border-radius:9px;padding:11px 10px;font-size:14.5px;font-family:inherit;font-weight:600;cursor:pointer}
  #copy{background:var(--accent);color:#fff}
  #toggle{background:var(--accent2);color:var(--accent);flex:0 0 72px}
  #clear{background:var(--accent2);color:var(--accent);flex:0 0 64px}
  button:active{opacity:.85}
  #out{height:66px;font-size:12.5px;line-height:1.45;resize:none;background:#faf7f1;font-family:ui-monospace,Menlo,monospace;display:none;margin-top:8px}
  #out.show{display:block}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(43,38,34,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>性格欄拼裝器</h1>
  <div class="hint">點選項，底部即時生成，一鍵複製貼進性格欄。</div>
  <div class="topbar">
    <button id="langBtn">简体</button>
    <button id="scanBtn">錄入文段</button>
  </div>
  <div class="field">
    <label>角色本名（可選）</label>
    <input type="text" id="name" placeholder="例：夏斌薄">
  </div>
  <div class="field">
    <label>核心一句話（強烈建議填）</label>
    <input type="text" id="core" placeholder="例：他要的東西從來不問，直接拿。">
  </div>
</header>

<main id="sections"></main>

<footer>
  <div class="bar">
    <button id="copy">複製</button>
    <button id="toggle">預覽</button>
    <button id="clear">清空</button>
  </div>
  <textarea id="out" placeholder="選了就會出現在這裡"></textarea>
</footer>

<div id="scan" class="modal">
  <div class="mbox">
    <div class="mhead"><span>錄入文段</span><span id="scanClose">✕</span></div>
    <textarea id="scanText" placeholder="貼一段小說原文，按「匹配」找出對應的性格選項"></textarea>
    <div class="mact">
      <button id="scanRun">匹配</button>
      <button id="scanApply">確定</button>
    </div>
    <div id="scanResult"></div>
  </div>
</div>

<div id="toast"></div>

const ORDER = Object.keys(DATA);
const picked = {};
ORDER.forEach(k => picked[k] = new Set());

const main = document.getElementById('sections');

ORDER.forEach(key => {
  const d = document.createElement('details');
  const s = document.createElement('summary');
  const label = document.createElement('span');
  label.textContent = key;
  const cnt = document.createElement('span');
  cnt.className = 'cnt zero';
  cnt.textContent = '0';
  s.appendChild(label);
  s.appendChild(cnt);
  d.appendChild(s);

  const box = document.createElement('div');
  box.className = 'opts';

  if (DATA[key].some(o => o[1] === 'm' || o[1] === 'f')) {
    const gf = document.createElement('div');
    gf.className = 'gfilter';
    [['all', '全部'], ['m', '男'], ['f', '女'], ['n', '中']].forEach(([g, label]) => {
      const gb = document.createElement('button');
      gb.textContent = label;
      gb.dataset.g = g;
      if (g === 'all') gb.classList.add('on');
      gb.addEventListener('click', (e) => {
        e.preventDefault();
        gf.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        gb.classList.add('on');
        box.querySelectorAll('.opt').forEach(el => {
          el.style.display = (g === 'all' || el.dataset.g === g) ? '' : 'none';
        });
      });
      gf.appendChild(gb);
    });
    d.appendChild(gf);
  }
  DATA[key].forEach(o => {
    const txt = o[0], g = o[1] || 'n';
    const b = document.createElement('div');
    b.className = 'opt';
    b.dataset.base = txt;
    b.dataset.dim = key;
    b.dataset.g = g;
    b.textContent = txt;
    b.addEventListener('click', () => {
      if (picked[key].has(txt)) {
        picked[key].delete(txt);
        b.classList.remove('on');
      } else {
        picked[key].add(txt);
        b.classList.add('on');
      }
      const n = picked[key].size;
      cnt.textContent = n;
      cnt.className = 'cnt' + (n ? '' : ' zero');
      refresh();
    });
    box.appendChild(b);
  });
  d.appendChild(box);
  d.addEventListener('toggle', () => {
    if (!d.open) return;
    document.querySelectorAll('details[open]').forEach(o => { if (o !== d) o.open = false; });
    setTimeout(() => d.scrollIntoView({block: 'start', behavior: 'smooth'}), 80);
  });
  main.appendChild(d);
});

function build(){
  const lines = [];
  const name = document.getElementById('name').value.trim();
  const core = document.getElementById('core').value.trim();
  if (name) lines.push(cv('角色：') + name);
  if (core) lines.push(cv('最核心的一點：') + core);
  ORDER.forEach(k => {
    const arr = Array.from(picked[k]);
    if (arr.length) lines.push(cv(k) + '：' + arr.map(cv).join('；'));
  });
  return lines.join('\n');
}

function refresh(){
  document.getElementById('out').value = build();
}

document.getElementById('name').addEventListener('input', refresh);
document.getElementById('core').addEventListener('input', refresh);

document.getElementById('copy').addEventListener('click', async () => {
  const out = document.getElementById('out');
  const text = out.value;
  if (!text.trim()) { toast('還沒選東西'); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast('已複製');
  } catch (e) {
    out.select();
    document.execCommand('copy');
    toast('已複製');
  }
});

document.getElementById('toggle').addEventListener('click', () => {
  const out = document.getElementById('out');
  out.classList.toggle('show');
  document.getElementById('toggle').textContent = out.classList.contains('show') ? '收起' : '預覽';
});

document.getElementById('clear').addEventListener('click', () => {
  ORDER.forEach(k => picked[k].clear());
  document.querySelectorAll('.opt.on').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('summary .cnt').forEach(c => { c.textContent='0'; c.className='cnt zero'; });
  refresh();
});

}

function toSimp(s) { let o = ''; for (const c of s) o += T2S[c] || c; return o; }
function cv(s) { return lang === 'sim' ? toSimp(s) : s; }

const textSeen = new Set();
const textNodes = [];
function collectText() {
  if (!document.body) return;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      if (!p) return NodeFilter.FILTER_REJECT;
      const tag = p.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA' || tag === 'INPUT') return NodeFilter.FILTER_REJECT;
      if (p.closest('.opt') || p.closest('#langBtn') || p.closest('#scanResult')) return NodeFilter.FILTER_REJECT;
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while ((n = walker.nextNode())) {
    if (!textSeen.has(n)) { textSeen.add(n); textNodes.push({ n, orig: n.nodeValue }); }
  }
}
function applyText() {
  collectText();
  textNodes.forEach(o => {
    if (!o.n.isConnected) return;
    o.n.nodeValue = lang === 'sim' ? toSimp(o.orig) : o.orig;
  });
}

function paintLang() {
  const btn = document.getElementById('langBtn');
  btn.textContent = lang === 'sim' ? '简体' : '繁體';
  document.querySelectorAll('.opt').forEach(el => { if (el.dataset.base) el.textContent = cv(el.dataset.base); });
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'sim' ? 'trad' : 'sim';
  localStorage.setItem('cs_lang', lang);
  paintLang();
  applyText();
  refresh();
  toast(lang === 'sim' ? '已切換為簡體' : '已切換為繁體');
});

/* ===== 錄入文段匹配 ===== */
const scanEl = document.getElementById('scan');
let scanHits = [];

function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

document.getElementById('scanBtn').addEventListener('click', () => scanEl.classList.add('show'));
document.getElementById('scanClose').addEventListener('click', () => scanEl.classList.remove('show'));
document.getElementById('scanRun').addEventListener('click', runScan);
document.getElementById('scanApply').addEventListener('click', applyScan);
scanEl.addEventListener('click', e => { if (e.target === scanEl) applyScan(); });

function runScan() {
  const raw = document.getElementById('scanText').value;
  const src = toSimp(raw);
  scanHits = [];
  ORDER.forEach(k => {
    DATA[k].forEach(o => {
      const opt = o[0];
      const core = opt.replace(/（[^）]*）/g, '');
      const keys = core.split(/[，、；,;。]/).map(x => x.trim()).filter(x => x.length >= 2);
      for (const key of keys) {
        const kk = toSimp(key);
        const i = src.indexOf(kk);
        if (i >= 0) { scanHits.push({ dim: k, opt, start: i, len: kk.length }); break; }
      }
    });
  });
  renderScan(raw);
}

function renderScan(raw) {
  const box = document.getElementById('scanResult');
  if (!scanHits.length) {
    box.innerHTML = '<div style="color:#a08a70">沒有匹配到。多貼幾段，或貼角色出場的段落。</div>';
    return;
  }
  const marks = scanHits.map(h => ({ s: h.start, e: h.start + h.len })).sort((a, b) => a.s - b.s);
  const merged = [];
  for (const m of marks) {
    const last = merged[merged.length - 1];
    if (last && m.s <= last.e) last.e = Math.max(last.e, m.e);
    else merged.push({ s: m.s, e: m.e });
  }
  let html = '', pos = 0;
  for (const m of merged) {
    html += esc(raw.slice(pos, m.s)) + '<span class="mh">' + esc(raw.slice(m.s, m.e)) + '</span>';
    pos = m.e;
  }
  html += esc(raw.slice(pos));

  const groups = {};
  scanHits.forEach(h => { (groups[h.dim] = groups[h.dim] || []).push(h.opt); });
  let list = '';
  ORDER.forEach(k => {
    if (!groups[k]) return;
    list += '<div class="mgroup">' + esc(cv(k)) + '</div>';
    groups[k].forEach(opt => {
      list += '<label class="mitem"><input type="checkbox" checked data-dim="' + esc(k) + '" data-opt="' + esc(opt) + '"><span>' + esc(cv(opt)) + '</span></label>';
    });
  });
  box.innerHTML = '<div style="margin-bottom:6px">原文命中位置：</div><div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:140px;overflow-y:auto;margin-bottom:8px">' + html + '</div>' + list;
}

function applyScan() {
  document.querySelectorAll('#scanResult input[type=checkbox]').forEach(cb => {
    if (cb.checked) picked[cb.dataset.dim].add(cb.dataset.opt);
  });
  ORDER.forEach(k => {
    const det = document.querySelectorAll('details')[ORDER.indexOf(k)];
    if (!det) return;
    const cnt = det.querySelector('.cnt');
    const n = picked[k].size;
    cnt.textContent = n;
    cnt.className = 'cnt' + (n ? '' : ' zero');
  });
  document.querySelectorAll('.opt').forEach(el => {
    const set = picked[el.dataset.dim];
    if (set && set.has(el.dataset.base)) el.classList.add('on');
  });
  refresh();
  scanEl.classList.remove('show');
}

paintLang();
applyText();

refresh();
